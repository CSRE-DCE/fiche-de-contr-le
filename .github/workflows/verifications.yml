# Vérifications automatiques à chaque push et pull request (aucun déploiement : GitHub Pages publie la branche
# telle quelle, réglage « Deploy from a branch »). Python uniquement, aucun Node.
#   1. tools/check_release.py : SHELL du service worker, chemins relatifs, JSON, numéro de version (AUDIT_BUILD) ;
#   2. pytest : tests unitaires dans le navigateur, tests de fumée (dont hors connexion), tournées de bout en bout,
#      synchronisation GitHub sur un faux serveur (tests/fake_github.py) — Chromium via Playwright.
name: Vérifications

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifications:
    name: Vérification avant publication et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupération du dépôt (historique complet pour comparer AUDIT_BUILD)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dépendances de test (pytest, Playwright)
        run: pip install -r requirements-dev.txt

      - name: Navigateur Chromium (Playwright)
        run: python -m playwright install --with-deps chromium

      - name: Vérification avant publication
        # Base de comparaison d'AUDIT_BUILD : branche cible d'une pull request, sinon état de la branche avant ce
        # push (tous les commits poussés ensemble), sinon le choix par défaut de l'outil (origin/main ou HEAD~1).
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python tools/check_release.py --base "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python tools/check_release.py --base "$BEFORE"
          else
            python tools/check_release.py
          fi

      - name: Tests (pytest + Playwright)
        run: python -m pytest -q
