# Configuration de pytest : tests de bout en bout (Playwright Python) et tests unitaires dans le navigateur.
# Lancer depuis la racine du dépôt :  python -m pytest -q
[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    allow_console_errors: tolère les erreurs de console et exceptions JavaScript (toutes, ou celles correspondant aux motifs donnés en arguments)
    lent: test long (tournées complètes, génération de PDF) ; à exclure avec -m "not lent"
