<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d3577">
<title>Charte graphique — Fiches de contrôle terrain OEG</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../css/sheet.css">
<link rel="stylesheet" href="../css/station.css">
<style>
/* Mise en page propre à ce guide de style (préfixe cg-) ; tout le reste vient de styles.css, css/sheet.css et
   css/station.css (accueil rangé par réseau).
   Ce guide est « vivant » : il assemble les vrais composants (js/ui/sheet-chrome.js, js/ui/icons.js) et,
   quand elle est disponible, la vraie grille « en feuilles » (js/domain/default-grids.js). */
body{padding-bottom:40px}
.cg-wrap{max-width:1640px;margin:0 auto;padding:0 clamp(10px,2vw,28px) 40px}
.cg-top{position:relative;top:auto;z-index:1;border-radius:0 0 18px 18px}
.cg-nav{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:10px 2px 10px;margin:0 -2px;scrollbar-width:thin;background:linear-gradient(var(--paper) 80%,transparent)}
.cg-nav a{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px;border-radius:999px;background:#fff;border:2px solid var(--line);text-decoration:none;color:var(--brand);font-weight:700;font-size:14.5px}
.cg-nav a i{width:16px;height:16px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px #fff,0 0 0 3px #0001}
.cg-nav a .ico{width:18px;height:18px}
.cg-h2{font-family:var(--font-cond);font-weight:800;text-transform:uppercase;color:var(--brand);font-size:clamp(22px,2.4vw,30px);margin:34px 0 6px;letter-spacing:.01em;scroll-margin-top:70px}
.cg-h3{font-family:var(--font-cond);font-weight:800;text-transform:uppercase;color:var(--brand);font-size:18px;margin:22px 0 8px;letter-spacing:.02em}
.cg-lead{color:var(--muted);margin:0 0 14px;max-width:76em}
.cg-lead code,.cg-note code{font-size:.92em;background:#e6f0fa;border-radius:5px;padding:0 4px}
.cg-swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0 4px}
.cg-sw{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;font-size:12.5px}
.cg-sw b{display:block;height:44px}
.cg-sw span{display:block;padding:5px 8px;font-family:"SFMono-Regular",Consolas,monospace;overflow-wrap:anywhere}
.cg-type{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.cg-type .card p{margin:4px 0}
.cg-icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cg-icon{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px 8px;text-align:center;color:#0d3577;font-size:12.5px;font-weight:600}
.cg-icon.new{border-color:#9fc5e4;background:linear-gradient(180deg,#f2f8fd,#fff)}
.cg-icon .pills{display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:6px}
.cg-icon .pill{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#0b6cb4;color:#fff}
.cg-demo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:12px;align-items:start}
.cg-demo>.card{margin:0}
.cg-stack>*+*{margin-top:12px}
.cg-sheet-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:36px 0 10px;scroll-margin-top:70px}
.cg-sheet-h h2{margin:0;font-family:var(--font-cond);font-weight:800;text-transform:uppercase;color:var(--brand);font-size:22px}
.cg-sheet-h .badge{font-size:13px}
.cg-note{font-size:13px;color:var(--muted);margin:6px 2px 0}
.cg-more{margin:2px 4px;font-size:13px;color:var(--oeg-muted);font-style:italic}
.cg-cols2{display:grid;grid-template-columns:1fr;gap:clamp(8px,1vw,14px);align-items:start}
.cg-cols2>*,.cg-f1>*,.cg-kit-grid>*{min-width:0}
@media(min-width:1100px){.cg-cols2{grid-template-columns:1fr 1fr}.cg-cols2>.cg-span{grid-column:1 / -1}}
/* Feuille 1 (démonstration de composition ; la vraie fiche station est js/views/station-sheet.js) */
.cg-f1{display:grid;grid-template-columns:1fr;gap:clamp(8px,1vw,14px);align-items:start}
@media(min-width:900px){.cg-f1{grid-template-columns:1.05fr 1fr}}
.cg-map{position:relative;min-height:260px;border-radius:12px;overflow:hidden;background:
  repeating-radial-gradient(circle at 30% 60%,#d7ebd2 0 14px,#e4f2de 14px 28px);border:1.5px solid #9cc3a0;display:grid;place-items:center}
.cg-map::before{content:"";position:absolute;left:-10%;right:-10%;top:48%;height:34px;background:#9fd3f0;transform:rotate(-8deg);border-radius:20px;box-shadow:0 0 0 2px #6fb6e0}
.cg-map .cg-star{position:relative;z-index:1;display:grid;place-items:center;width:34px;height:34px;color:#d62a1e;filter:drop-shadow(0 1px 2px #0006)}
.cg-map .guyane-inset{position:absolute;left:8px;top:8px;background:#fff;border:1px solid #0003;padding:4px;border-radius:4px}
.cg-map .cg-legend{position:absolute;right:8px;bottom:8px;background:#fff;border:1px solid #0d357733;border-radius:6px;padding:6px 10px;font-size:12px;line-height:1.5;color:#0d3577}
.cg-map .cg-north{position:absolute;right:12px;top:8px;font-family:var(--f-cond);font-weight:800;color:#0d3577;text-align:center;line-height:1}
.cg-photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cg-photos figure{position:relative;margin:0;border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:#cfe6f3}
.cg-photos img{width:100%;height:100%;object-fit:cover;display:block}
.cg-photos figcaption{position:absolute;left:8px;bottom:8px;background:#fffffff0;color:#0d3577;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:500}
.cg-photos figcaption b{font-weight:700}
.cg-access{display:flex;gap:14px;align-items:flex-start}
.cg-access>.ico{flex:none;color:var(--th-dark)}
.cg-comp{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cg-comp li{display:flex;align-items:center;gap:12px;min-height:40px}
.cg-comp .pill{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--th-light);color:var(--th-dark)}
.cg-comp .pill .ico{width:22px;height:22px}
.cg-comp li>span:nth-child(2){flex:1}
/* Module « appareils de mesure » (feuille 4) */
.cg-instr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:clamp(6px,.8vw,12px)}
.cg-instr .sec-no.is-txt{font-size:15px}
.cg-kv{display:grid;gap:2px;font-size:14px}
.cg-kv>div{display:flex;gap:6px;align-items:baseline}
.cg-kv>div>span{white-space:nowrap;color:var(--th-dark)}
.cg-kv>div>i{flex:1;border-bottom:1.5px dotted var(--oeg-dots);min-height:20px}
.cg-section-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:clamp(16px,1.45vw,22px);color:var(--th-bar-text,#0d3577)}
.cg-section-title .bc-ic{width:clamp(34px,2.9vw,44px)}
.cg-kit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(8px,1vw,14px);align-items:start}
.cg-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:thin}
.cg-tab{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:4px 14px 4px 6px;border-radius:12px;border:2px solid var(--th-line);background:#fff;font-weight:700;color:var(--th-dark);font-size:14px}
.cg-tab b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--th-main);color:#fff;font-family:var(--f-cond);font-size:16px}
.cg-tab small{font-weight:600;color:var(--oeg-muted)}
.cg-tab.sel{background:var(--th-main);border-color:var(--th-main);color:#fff}.cg-tab.sel b{background:#fff;color:var(--th-main)}.cg-tab.sel small{color:#fff}
@media print{.cg-top,.cg-nav,.cg-h2,.cg-h3,.cg-lead,.cg-sheet-h,.cg-intro,.cg-section-app,.cg-icons-sec,.cg-fiches,.cg-themes-sec{display:none!important}.cg-wrap{padding:0;max-width:none}}
</style>
</head>
<body>
<div class="cg-wrap">
  <header class="cg-top app-top">
    <img class="logo" src="../icons/logo-oeg-rond.png" alt="Office de l’Eau de Guyane" width="46" height="46">
    <div class="titles"><h1>Charte graphique — fiches de contrôle terrain</h1><small>Office de l’Eau de Guyane · guide de style vivant (js/ui/sheet-chrome.js, js/ui/icons.js, css/sheet.css, styles.css)</small></div>
    <button class="top-pill" type="button" id="cgSun" title="Mode plein soleil (contraste renforcé)"><span class="lbl">Plein soleil</span></button>
    <a class="top-pill" href="../index.html"><span class="lbl">Application</span></a>
  </header>
  <nav class="cg-nav" id="cgNav" aria-label="Sommaire du guide"></nav>
  <div id="cg">Chargement…</div>
</div>
<script type="module">
import { html, raw } from '../js/core/util.js';
import { THEMES, OEG } from '../js/ui/themes.js';
import { icon, ICON_NAMES } from '../js/ui/icons.js';
import { oegHeader, stationBanner, infoStrip, sectionCard, blockCard, checkSquare, guyaneInset, sheetFooter, sheetFrame, dotLines,
  STATUS_SCALE, statusHeadCells, statusLegend, sharedBadge, tourStations, majorBadge, gradeBox, gradePill } from '../js/ui/sheet-chrome.js';
import { gradeOf } from '../js/domain/grading.js';
import { NETWORK_DEFAULTS, networkColors } from '../js/domain/networks.js';

/* ---------- Données d'exemple ---------- */
const SITE = { id: 'site-09271503', name: 'Athanase', code: '09271503', codeType: 'SANDRE', bassin: 'Approuague', riverName: 'Approuague', commune: 'Régina',
  x: 356714, y: 465112, lat: 4.206867, lon: -52.291022, her: 52, pressions: '' };
const SITE_ESO = { id: 'site-BSS002PANK', name: 'AEP Maripasoula', code: 'BSS002PANK', codeType: 'BSS', commune: 'Maripasoula', x: 163100, y: 402750,
  nature: 'Unité de traitement / Forages (60 m)', aquifere: 'Horizon fissuré + fracture profonde', usage: 'Alimentation en eau potable' };
const PHOTO = n => `../img/stations/09271503/${n}.jpg`;
const NEW_ICONS = ['pump', 'well', 'faucet', 'filter', 'gauge', 'route', 'car', 'bucket', 'timer'];

/* Grille « en feuilles » réelle (si disponible) ; sinon structure de repli conforme à la spécification. */
let GRID = null, gridsMod = null;
try { const m = await import('../js/domain/default-grids.js'); GRID = (m.DEFAULT_GRIDS || []).find(g => g?.layout === 'sheets') || null; } catch (e) { GRID = null; }
try { gridsMod = await import('../js/domain/grids.js'); } catch (e) { gridsMod = null; }
const FALLBACK_HEADER = { org: 'Office de l’Eau de Guyane', title: 'Contrôle terrain prestataire – {prestataire} – {programme}', subtitle: 'Fiche station de contrôle terrain',
  tagline: 'L’eau au service des milieux naturels de Guyane', program: 'Suivi biologique des eaux douces de surface de Guyane',
  slogan: 'La connaissance aujourd’hui pour les rivières de demain', website: 'www.eauguyane.fr' };
const HEADER = { ...FALLBACK_HEADER, ...(GRID?.header || {}) };
/* En-tête résolu (headerOf / headerTitle de js/domain/grids.js si l'avenant est intégré, sinon substitution locale). */
function resolvedHeader(provider, program, auditType, subtitle) {
  try {
    if (gridsMod?.headerOf && GRID?.types?.length) { const h = gridsMod.headerOf(GRID, { provider: { name: provider }, auditType }); if (h.title) return { title: h.title, subtitle: h.subtitle || subtitle }; }
  } catch (e) { /* repli */ }
  return { title: String(HEADER.title).replace('{prestataire}', provider).replace('{programme}', program).replace(/HYDRECO – RCS ESC BIO 2026$/, `${provider} – ${program}`), subtitle };
}
const HEAD_BIO = resolvedHeader('HYDRECO', 'RCS ESC BIO 2026', 'bio', 'Fiche station de contrôle terrain');
const HEAD_ESO = resolvedHeader('Titulaire du marché – lot 1', 'Surveillance des eaux souterraines 2026', 'eso', 'Fiche de contrôle terrain');
const TITLE_BIO = HEAD_BIO.title, TITLE_ESO = HEAD_ESO.title;

const it = (sheet, no, label, short, extra = {}) => ({ id: `it-F${sheet}-${no}`, no: String(no), label, short, kind: 'conformity', required: true, input: { type: 'text' }, ...extra });
const FALLBACK_F10 = {
  sheet: { no: 10, key: 'eso-ouvrage', tab: 'Ouvrage et purge', title: 'Eau souterraine – ouvrage, pompage et purge', kicker: 'Surveillance des eaux souterraines', theme: 'slate', layout: 'table', scope: 'station',
    blocks: [{ key: 'observations', title: 'Observations / non-conformités / actions demandées', icon: 'chat' },
      { key: 'conclusion', title: 'Bilan – Purge et mesure des paramètres in situ', icon: 'check', options: [['C', 'Satisfaisant'], ['P', 'Perfectible'], ['NC', 'Non satisfaisant']], fields: ['controller', 'date', 'signature'] }] },
  sections: [
    { id: 's-F10-1', sheet: 10, no: '1', title: 'Caractéristiques du point de prélèvement', icon: 'well', columns: 'full', items: [
      it(10, 1, 'Configuration de l’ouvrage', 'Config.', { kind: 'select', input: null, options: ['Robinet', 'Puits réservoir', 'Émergence de la source', 'Piézomètre', 'Autre'], icon: 'well' }),
      it(10, 2, 'Pompe à demeure', 'Pompe', { kind: 'text', icon: 'pump', input: { type: 'fields', fields: [{ key: 'choix', type: 'choice', options: ['Oui', 'Non'] }, { key: 'etat', label: 'État', type: 'text' }] } }),
      it(10, 3, 'Pompe installée par le préleveur', 'Pompe prél.', { icon: 'pump', input: { type: 'fields', fields: [{ key: 'alimentation', type: 'choice', options: ['Batterie portative', 'Véhicule', 'Groupe électrogène'] }] } }),
      it(10, 4, 'Vigilance vis-à-vis des gaz d’échappement', 'Gaz', { icon: 'car' })] },
    { id: 's-F10-2', sheet: 10, no: '2', title: 'Purge', icon: 'timer', columns: 'full', items: [
      it(10, 5, 'Purge de l’ouvrage et/ou des canalisations', 'Purge', { icon: 'timer', input: { type: 'fields', fields: [{ key: 'duree', label: 'Durée', type: 'number', unit: 'min' }, { key: 'type', type: 'choice', options: ['Canalisations', 'Ouvrage'] }] } }),
      it(10, 6, 'Technique de purge adaptée à la configuration du point d’eau', 'Technique', { icon: 'faucet' })] },
    { id: 's-F10-3', sheet: 10, no: '3', title: 'Niveau piézométrique', icon: 'gauge', columns: 'full', items: [
      it(10, 7, 'Mesure du niveau piézométrique', 'Niveau', { icon: 'gauge', input: { type: 'fields', fields: [{ key: 'statique', label: 'Statique', type: 'number', unit: 'm' }, { key: 'dynamique', label: 'Dynamique', type: 'number', unit: 'm' }] } })] }
  ]
};
const FALLBACK_SHEETS = [
  { no: 1, title: 'Fiche station de contrôle terrain', kicker: 'Suivi biologique des eaux douces de surface de Guyane', theme: 'ocean', layout: 'station', blocks: [] },
  { no: 2, title: 'Organisation, sécurité et déroulé de mission', kicker: '', theme: 'navy', layout: 'table', blocks: [{ key: 'observations', title: 'Observations / non-conformités / actions demandées', icon: 'chat' }] },
  { no: 3, title: 'Prise d’informations de terrain – caractérisation de la station', kicker: 'Prise d’informations de terrain – caractérisation de la station', theme: 'green', layout: 'table', blocks: [] },
  FALLBACK_F10.sheet,
  { no: 4, title: 'Physico-chimie, mesures in situ et flaconnage', theme: 'peach', layout: 'table', modules: ['instruments'], blocks: [] },
  { no: 5, title: 'Physico-chimie – prélèvement, conditionnement et chaîne du froid', theme: 'orange', layout: 'table', blocks: [] },
  { no: 6, title: 'Invertébrés aquatiques – protocole PEZADA', kicker: 'Suivi biologique des eaux douces de surface de Guyane', theme: 'violet', layout: 'table', blocks: [] },
  { no: 7, title: 'Diatomées – IDGF', kicker: 'Fiche de contrôle terrain – Diatomées – IDGF', theme: 'sky', layout: 'table', blocks: [] },
  { no: 8, title: 'Ichtyologie et mercure dans le biote', kicker: 'Suivi biologique des eaux douces de Guyane', theme: 'ocean', layout: 'split', blocks: [] },
  { no: 9, title: 'Phytoplancton d’eau douce', kicker: 'Phytoplancton d’eau douce', theme: 'teal', layout: 'table', blocks: [] }
];
const SHEETS = (GRID?.sheets?.length ? [...GRID.sheets] : FALLBACK_SHEETS).slice();
if (!SHEETS.some(s => String(s.no) === '10')) SHEETS.splice(Math.max(0, SHEETS.findIndex(s => String(s.no) === '3') + 1), 0, FALLBACK_F10.sheet);
const SECTIONS = [...(GRID?.sections || [])];
if (!SECTIONS.some(s => String(s.sheet) === '10')) SECTIONS.push(...FALLBACK_F10.sections);
const FALLBACK_ROWS = [
  it(0, 1, 'Agent prestataire & fonction', 'A1', { icon: 'person', input: { type: 'fields', fields: [{ key: 'nom', label: 'Nom', type: 'text' }, { key: 'fonction', label: 'Fonction', type: 'text' }] } }),
  it(0, 2, 'Fiche terrain complétée', 'A2', { icon: 'clipboard', input: { type: 'fields', fields: [{ key: 'choix', type: 'choice', options: ['Oui', 'Non', 'Partielle'] }] } }),
  it(0, 3, 'Coordonnées du point', 'A3', { icon: 'pin', input: { type: 'fields', gps: true, fields: [{ key: 'x', label: 'X', type: 'number' }, { key: 'y', label: 'Y', type: 'number' }] } }),
  it(0, 4, 'Température de conservation', 'T° conserv.', { icon: 'thermometer', input: { type: 'number', unit: '°C' } }),
  it(0, 5, 'Transport / acheminement', 'A13', { icon: 'truck' })
];
const sectionsOf = no => {
  const own = SECTIONS.filter(s => String(s.sheet) === String(no));
  return own.length ? own : [{ id: 'demo-' + no, sheet: no, no: '', title: 'Contrôle terrain', columns: 'full', items: FALLBACK_ROWS.map(r => ({ ...r })) }];
};
/* Rang affiché « Feuille X / N » : ordre du tableau sheets, tournée biologie complète (1 à 9 comme les maquettes). */
const BIO_ORDER = SHEETS.filter(s => String(s.no) !== '10');
const displayNo = sh => String(sh.no) === '10' ? { index: 2, total: 5 } : { index: BIO_ORDER.indexOf(sh) + 1, total: BIO_ORDER.length };

/* ---------- Valeurs et statuts d'exemple ---------- */
const PREFILL = { 'site.name': s => String(s.name).toUpperCase(), 'site.code': s => s.code, 'site.bassin': s => s.bassin || '', 'site.riverName': s => s.riverName || '',
  'site.commune': s => s.commune || '', 'site.her': s => s.her ?? '', 'site.pressions': s => s.pressions || '', 'site.strahler': () => '', 'audit.date': () => '2026-10-09',
  'audit.time': () => '08:30', 'auditor.name': () => 'Marie Contrôleuse', 'provider.name': () => 'HYDRECO', 'prestation.operators': () => 'J. Martin, L. Pierre',
  'site.xy': s => ({ x: s.x, y: s.y }), 'audit.kind': () => 'Inopiné' };
const SAMPLE_UNIT = { '°C': '6,5', 'mg/L': '7,8', '%': '92', 'µS/cm': '42', 'unité pH': '6,4', 'm': '2', 'NTU': '3,1', 'min': '15', 'mV': '180' };
const PATTERN = ['C', 'C', 'P', '', 'C', 'NC', 'NA', 'C', '', 'C', 'P', 'C', ''];
const OBS = { P: 'À améliorer : étiquetage manuscrit peu lisible', NC: 'Glacière sans pain de glace : 11,5 °C — action demandée' };
const isConf = item => item.kind === 'conformity' || (!item.kind && item.responses);
const statusOf = (item, i) => isConf(item) ? PATTERN[i % PATTERN.length] : '';
const filledOf = i => i % 4 !== 3;
const splitParen = s => { const t = String(s || ''), k = t.indexOf(' ('); return k > 0 ? html`${t.slice(0, k)} <small>${t.slice(k + 1)}</small>` : t; };

function fieldsValue(item, inp, pre, filled) {
  const vals = { ...(pre && typeof pre === 'object' ? pre : {}) };
  for (const f of inp.fields || []) if (f.type === 'choice' && filled && f.options?.length) vals[f.key] = f.options[0];
  /* Champ conditionnel (showIf : objet ou liste) affiché seulement si la condition est remplie. */
  const shown = f => !f.showIf || [].concat(f.showIf).some(c => vals[c.key] === c.value);
  return html`<div class="st-fields">${(inp.fields || []).filter(shown).map(f => {
    if (f.type === 'choice') {
      const choice = html`<span class="st-choice">${(f.options || []).map((o, k) => html`<button type="button" class="${filled && k === 0 ? 'sel' : ''}" aria-pressed="${filled && k === 0}">${checkSquare({ checked: filled && k === 0 })}${o}</button>`)}</span>`;
      return f.label ? html`<span class="st-field is-choice"><span class="st-k">${f.label}&nbsp;:</span>${choice}</span>` : choice;
    }
    const v = vals[f.key] ?? (filled && f.type === 'number' ? (SAMPLE_UNIT[f.unit] || '') : '');
    return html`<span class="st-field">${f.label ? html`<span class="st-k">${f.label}&nbsp;:</span>` : ''}<input ${raw(f.type === 'number' ? 'inputmode="decimal"' : '')} value="${v}" aria-label="${f.label || item.label}">${f.unit ? html`<span class="st-unit">${f.unit}</span>` : ''}</span>`;
  })}${inp.gps ? html`<button type="button" class="st-gps">${icon('pin')}Relever</button>` : ''}</div>`;
}
function valueField(item, site, i) {
  const pre = item.prefill && PREFILL[item.prefill] ? PREFILL[item.prefill](site) : '';
  const filled = filledOf(i);
  const inp = isConf(item) ? item.input
    : item.kind === 'fields' ? { type: 'fields', fields: item.fields || item.input?.fields || [], gps: item.gps || item.input?.gps }
    : { type: item.kind, options: item.options || item.input?.options, ...(item.input || {}) };
  if (!inp || !inp.type) return html`<span class="st-dots"></span>`;
  switch (inp.type) {
    case 'number': return html`<span class="st-fields"><span class="st-field"><input inputmode="decimal" value="${filled ? (SAMPLE_UNIT[inp.unit] || '4') : ''}" aria-label="${item.label}">${inp.unit ? html`<span class="st-unit">${inp.unit}</span>` : ''}</span></span>`;
    case 'date': return html`<input type="date" value="${pre || ''}" aria-label="${item.label}">`;
    case 'time': return html`<input type="time" value="${pre || ''}" aria-label="${item.label}">`;
    case 'select': return html`<select aria-label="${item.label}"><option value=""></option>${(inp.options || []).map((o, k) => html`<option ${raw(filled && k === 1 ? 'selected' : '')}>${o}</option>`)}</select>`;
    case 'longtext': return html`<textarea rows="1" aria-label="${item.label}">${pre || ''}</textarea>`;
    case 'fields': return fieldsValue(item, inp, pre, filled);
    default: return html`<input value="${typeof pre === 'string' ? pre : ''}" aria-label="${item.label}">`;

const statusCell = (code, cur) => {

};
const rowCls = (st, conf) => st === 'NC' ? 'is-nc' : st === 'P' ? 'is-p' : st === 'C' ? 'is-c' : st === 'NA' ? 'is-na' : conf ? 'is-missing' : '';

function demoTable(sec, site, { sheetNo = 0, maxCards = 4, boxed = false } = {}) {

      <div class="card"><h2>Barlow Condensed — titres</h2><p style="font-family:var(--font-cond);font-weight:600;font-size:22px">SEMIBOLD 600 — PRÉLÈVEMENT</p><p style="font-family:var(--font-cond);font-weight:700;font-size:24px">BOLD 700 — FEUILLE 4 / 9</p><p style="font-family:var(--font-cond);font-weight:800;font-size:28px;color:var(--brand)">EXTRABOLD 800 — OFFICE DE L’EAU DE GUYANE</p></div>
      <div class="card"><h2>Montserrat — station</h2><p style="font-family:var(--font-black);font-weight:800;font-size:26px">EXTRABOLD 800</p><p style="font-family:var(--font-black);font-weight:900;font-size:44px;color:var(--brand);line-height:1">ATHANASE</p></div>
    </div>
  </section>

  <section class="cg-icons-sec" id="pictos">
    <h2 class="cg-h2">Pictogrammes (${ICON_NAMES.length})</h2>
    <p class="cg-lead"><code>icon(nom, { size, cls, title })</code> — SVG en ligne, couleur héritée (currentColor), lisibles de 18 à 64 px, seuls ou blancs sur pastille ; rastérisables pour les PDF. Encadré bleuté : pictogrammes des fiches cours d’eau / eaux souterraines (avenant n° 1).</p>
    <div class="cg-icons">${ICON_NAMES.map(n => html`<div class="cg-icon${NEW_ICONS.includes(n) ? ' new' : ''}"><div class="pills"><span class="pill">${icon(n, { size: 26 })}</span>${icon(n, { size: 36 })}${icon(n, { size: 18 })}</div>${n}</div>`)}</div>
  </section>

  <section class="cg-section-app" id="app">
    <h2 class="cg-h2">Composants de l’application</h2>
    <p class="cg-lead">Boutons, champs, badges, listes et cartes (<code>styles.css</code>) — gros boutons tactiles (≥ 52 px, 60 px pour les réponses), coins arrondis, fond bleuté très clair ; bouton « Plein soleil » en haut de page pour le mode contrasté (<code>body.sun</code>).</p>
    <div class="cg-demo">
      <div class="card"><h2>Boutons ${icon('check-circle', { size: 20 })}</h2>
        <div class="btn-row"><button class="btn primary"><span class="ic">${icon('plus')}</span>Nouvelle tournée</button><button class="btn accent"><span class="ic">${icon('pdf')}</span>Fiches (PDF)</button></div>
        <div class="btn-row" style="margin-top:8px"><button class="btn ghost"><span class="ic">${icon('camera')}</span>Photo</button><button class="btn perf">Perfectible</button><button class="btn danger-ghost">Écart</button><button class="btn ok">Conforme</button><button class="btn ghost sm">Petit</button></div>
        <h3>Réponse (seg)</h3>
        <div class="seg"><button class="sel ok"><span class="k">✓</span>Conforme</button><button class="sel perf"><span class="k">≈</span>Perfectible</button><button><span class="k">✗</span>Non conforme</button><button><span class="k">—</span>Non applicable</button></div>
      </div>
      <div class="card"><h2>Champs et badges</h2>
        <div class="field"><label>Opérateurs HYDRECO <span class="req">*</span></label><input value="J. Martin, L. Pierre"></div>
        <div class="field"><label>Type de tournée</label><select><option>Hydrobiologie – RCS ESC BIO</option><option>Cours d’eau – physico-chimie</option><option>Eaux souterraines</option></select></div>
        <div class="row"><span class="badge ok">Conforme</span><span class="badge perf">2 P</span><span class="badge nc">1 NC</span><span class="badge warn">À planifier</span><span class="badge info">En cours</span><span class="badge brand">BIO 2026</span><span class="badge outline">09271503</span></div>
        <div class="chips" style="margin-top:10px"><button class="chip sel">${icon('station')}Biologie <span class="count">38</span></button><button class="chip">${icon('drop')}Cours d’eau</button><button class="chip">${icon('well')}Eaux souterraines <span class="count">17</span></button></div>
      </div>
      <div class="card"><h2>Listes et indicateurs</h2><div class="list">
        <a class="li stripe-info" href="#app"><span class="li-ic">${icon('station')}</span><div class="li-main"><div class="li-title">ATHANASE — 09271503</div><div class="li-sub">Approuague · à contrôler</div></div><span class="chev">${icon('chevron-right', { size: 20 })}</span></a>
        <a class="li stripe-perf" href="#app"><span class="li-ic">${icon('route')}</span><div class="li-main"><div class="li-title">AUD-2026-0012 · tournée de 3 stations</div><div class="li-sub">2 points perfectibles · en cours</div></div><span class="li-side"><span class="badge perf">2 P</span></span></a>
        <a class="li stripe-nc" href="#app"><span class="li-ic">${icon('well')}</span><div class="li-main"><div class="li-title">AEP Maripasoula — BSS002PANK</div><div class="li-sub">1 non-conformité · signé</div></div><span class="li-side"><span class="badge nc">1 NC</span></span></a>
      </div>
      <div class="kpis" style="margin-top:10px"><div class="kpi"><span class="v">38</span><span class="k">Stations BIO</span></div><div class="kpi warn-kpi"><span class="v">5</span><span class="k">Perfectibles</span></div><div class="kpi alert-kpi"><span class="v">3</span><span class="k">Écarts en retard</span></div></div></div>
      <div class="card"><h2>Bandeaux et alertes</h2>
        <div class="banner info">Tournée du 9 octobre 2026 — 3 stations, prestataire HYDRECO.</div>
        <div class="banner perf">2 points perfectibles : observation obligatoire.</div>
        <div class="alert attention"><span class="ic">${icon('thermometer', { size: 22 })}</span><div><div class="a-title">Température hors plage</div><div class="a-msg">11,5 °C : hors de la plage 5 ± 3 °C (NF EN ISO 5667-3).</div></div></div>
        <div class="progress" style="margin-top:6px"><span style="width:62%"></span></div>
      </div>
    </div>
  </section>

  ${networksDemo()}

  <section class="cg-fiches" id="fiches">
    <h2 class="cg-h2">Composants des fiches</h2>
    <p class="cg-lead"><code>js/ui/sheet-chrome.js</code> + <code>css/sheet.css</code>. En-tête OEG (variantes <code>default</code>, <code>band</code>, <code>compact</code> ; titre résolu <code>title</code>, numéro affiché <code>index / total</code>), bandeau station, bandeau d’information (Code SANDRE ou Code BSS + Commune), cartes de section, encadrés, cases, légende de l’échelle.</p>
    <div class="cg-stack">
      ${sheetFrame({ theme: 'navy', body: html`${oegHeader({ grid: GRID, sheet: SHEETS.find(s => String(s.no) === '2') || FALLBACK_SHEETS[1], site: SITE, variant: 'band', title: TITLE_BIO, subtitle: HEAD_BIO.subtitle, index: 2, total: 9 })}` })}
      ${sheetFrame({ theme: 'slate', body: html`${oegHeader({ grid: GRID, sheet: FALLBACK_F10.sheet, site: SITE_ESO, title: TITLE_ESO, subtitle: HEAD_ESO.subtitle, index: 2, total: 5, stationIndex: 1, stationTotal: 2 })}${infoStrip(SITE_ESO)}` })}
    </div>
    <div class="cg-demo" style="margin-top:12px">
      <div class="card"><h2>En-tête compact (mobile, onglets)</h2>${sheetFrame({ theme: 'peach', body: oegHeader({ grid: GRID, sheet: SHEETS.find(s => String(s.no) === '4'), site: SITE, variant: 'compact', title: TITLE_BIO, index: 4, total: 9 }) })}${sheetFrame({ theme: 'slate', body: oegHeader({ grid: GRID, sheet: FALLBACK_F10.sheet, site: SITE_ESO, variant: 'compact', title: TITLE_ESO, index: 2, total: 5, stationIndex: 1, stationTotal: 2 }) })}</div>
      <div class="card"><h2>Cases (checkSquare)</h2><div class="row">${checkSquare({})}${checkSquare({ checked: true })}${checkSquare({ checked: true, cls: 'ok' })}${checkSquare({ checked: true, cls: 'p' })}${checkSquare({ checked: true, cls: 'nc' })}${checkSquare({ checked: true, cls: 'na' })}${checkSquare({ cls: 'lg' })}${checkSquare({ checked: true, cls: 'lg' })}</div>
        <div class="row" style="margin-top:10px">${checkSquare({ label: 'Satisfaisant', cls: 'ok' })}${checkSquare({ label: 'Perfectible', cls: 'p', checked: true })}${checkSquare({ label: 'Non satisfaisant', cls: 'nc' })}${checkSquare({ label: 'Non applicable', cls: 'na' })}</div>
        <h3>Légende (statusLegend)</h3>${statusLegend()}</div>
      <div class="card" id="notation" style="grid-column:1/-1"><h2>Note sur 20 : badge, pastilles, grille de notation</h2>
        <p>Point majeur (compte double) : <b>Prélèvement après purge</b> ${majorBadge()} — critère commun : <b>Calibration des sondes</b> ${sharedBadge()}${majorBadge()}</p>
        <h3>Pastilles de note (gradePill) — colonnes « Note /20 »</h3>
        <div class="row">${[{ got2: 36, max2: 40 }, { got2: 29, max2: 40 }, { got2: 18, max2: 40 }, {}].map(t => gradePill(gradeOf(t), { label: true }))}</div>
        <h3>Encadré « Grille de notation » (gradeBox) — pied de feuille, synthèse</h3>
        <div class="cg-stack">
          ${gradeBox({ grade: gradeOf({ C: 12, P: 3, NC: 1, NA: 2, total: 19, evaluated: 16, majors: 4, excluded: 1, got2: 31, max2: 40, unanswered: 1 }), state: 'provisoire', theme: 'peach' })}
          ${gradeBox({ grade: gradeOf({ C: 15, P: 1, NC: 0, NA: 3, total: 19, evaluated: 16, majors: 3, got2: 37, max2: 38 }), state: 'figee', theme: 'navy', title: 'Grille de notation de la tournée' })}
          ${gradeBox({ grade: gradeOf({ C: 4, P: 2, NC: 5, total: 11, evaluated: 11, majors: 2, got2: 10, max2: 26 }), theme: 'slate' })}
          ${gradeBox({ grade: gradeOf({ NA: 6, total: 6 }), theme: 'green' })}
        </div>
        <p class="cg-note">Couleur de l’appréciation : vert « Satisfaisant », orange foncé « À améliorer », rouge « Insuffisant », gris « non noté » (js/domain/grading.js : C = 1, P = 0,5, NC = 0, N/A non compté, point majeur ×2, point de synthèse hors note).</p></div>
      <div class="card"><h2>Silhouette de la Guyane (guyaneInset)</h2><div class="row">${guyaneInset(SITE, { size: 60 })}${guyaneInset(SITE, { size: 90, label: 'ATHANASE' })}${guyaneInset(SITE_ESO, { size: 90, theme: 'slate', label: 'Maripasoula' })}${guyaneInset(SITE, { size: 90, theme: 'violet' })}</div></div>
    </div>
  </section>

  <section id="tournee">
    <h2 class="cg-h2">Tournée : sélecteur de stations et critères communs</h2>
    <p class="cg-lead"><code>tourStations({ stations, current, act, addAct })</code> — pastilles numérotées dans l’ordre de passage, avancement (barre), nombre de NC / P ; station courante en bleu marine, station complète en vert. <code>sharedBadge()</code> — badge « Commun à la tournée » des critères à réponse unique (<code>tr.is-shared</code> dans les tableaux).</p>
    <div class="cg-stack">
      ${tourStations({ stations: TOUR, current: '09271503', addAct: 'tour-add' })}
      ${sheetFrame({ theme: 'peach', body: html`<div class="cg-tabs" role="tablist" aria-label="Feuilles">${[['2', 'Organisation', '18/40'], ['1', 'Station', '7/7'], ['3', 'Caractérisation', '12/26'], ['4', 'PC in situ', '9/31'], ['5', 'PC prélèvement', '0/28']].map(([n, l, c], i) => html`<span class="cg-tab${i === 3 ? ' sel' : ''}"><b>${n}</b>${l}<small>${c}</small></span>`)}</div>
        <p class="cg-note">Onglets de feuilles (dessinés par la vue d’audit, ci-dessus à titre indicatif) : la feuille de tournée (F2) puis les feuilles de la station courante.</p>
        <p>Critère partagé : <b>Calibration des sondes</b> ${sharedBadge()}</p>` })}
    </div>
  </section>

  <section id="feuilles">
    <h2 class="cg-h2">Feuilles — compositions des maquettes</h2>
    <p class="cg-lead">Chaque feuille reprend sa maquette (<code>docs/maquettes</code>) : en-tête OEG, bandeau d’information à pastilles, cartes numérotées, tableau (≥ 1100 px) ou lignes en cartes (&lt; 1100 px) avec l’échelle C / P / NC / N/A, encadrés, pied de page vagues et forêt. Contenus : ${GRID ? html`grille <b>${GRID.code || GRID.id}</b> (js/domain)` : 'données de repli'}.</p>
  </section>
  ${SHEETS.map(sheetDemo)}

  <section class="cg-themes-sec" id="themes">
    <h2 class="cg-h2">Tous les thèmes</h2>
    <p class="cg-lead">Les mêmes composants dans chacun des ${THEME_ORDER.length} thèmes (classe <code>.th-&lt;nom&gt;</code> ou <code>sheetFrame({ theme })</code>), avec leur nuancier.</p>
  </section>
  ${THEME_ORDER.map(themeKit)}
`);

/* Mode plein soleil (comme l'option de l'application) */
const sunBtn = document.getElementById('cgSun');
sunBtn.innerHTML = String(html`${icon('sun', { size: 20 })}<span class="lbl">Plein soleil</span>`);
sunBtn.addEventListener('click', () => document.body.classList.toggle('sun'));
if (/[?&]sun\b/.test(location.search)) document.body.classList.add('sun');
window.__CHARTE_READY__ = true;
</script>
</body>
